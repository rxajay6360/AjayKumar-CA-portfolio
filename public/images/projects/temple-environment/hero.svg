<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="teAtmosphere" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stopColor="#4a1805"/>
      <stop offset="35%" stopColor="#1e0a03"/>
      <stop offset="80%" stopColor="#08080a"/>
      <stop offset="100%" stopColor="#040405"/>
    </radialGradient>
    <linearGradient id="godRay" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stopColor="#ffdb99" stopOpacity="0.45"/>
      <stop offset="50%" stopColor="#d49755" stopOpacity="0.15"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </linearGradient>
    <linearGradient id="stonePillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#2c2725"/>
      <stop offset="30%" stopColor="#574e4a"/>
      <stop offset="70%" stopColor="#3d3734"/>
      <stop offset="100%" stopColor="#1a1715"/>
    </linearGradient>
    <filter id="teVolumetric" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#teAtmosphere)"/>

  <!-- Atmospheric Volumetric God Rays through Skylight -->
  <polygon points="450,0 750,0 1100,800 250,800" fill="url(#godRay)" filter="url(#teVolumetric)"/>
  <polygon points="550,0 650,0 850,800 450,800" fill="url(#godRay)" opacity="0.6"/>

  <!-- Sacred Temple Architecture Sanctuary Background -->
  <!-- Rear Sanctum Arch & Shikara / Vimana -->
  <path d="M520,380 C520,260 640,200 640,200 C640,200 760,260 760,380 L760,650 L520,650 Z" fill="#151210" stroke="#ff2a3b" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="640" cy="300" r="45" fill="#ff5355" opacity="0.2"/>
  <text x="640" y="325" font-family="serif" font-size="70" fill="#d49755" text-anchor="middle" opacity="0.8">ॐ</text>

  <!-- Stepped Temple Altar Platform Base -->
  <polygon points="100,750 1180,750 1080,600 200,600" fill="#1b1816" stroke="#333" stroke-width="1"/>
  <polygon points="200,600 1080,600 980,520 300,520" fill="#24201d" stroke="#444" stroke-width="1"/>

  <!-- Ancient Carved Pillars (Foreground Left) -->
  <rect x="80" y="100" width="120" height="700" fill="url(#stonePillar)" stroke="#111" stroke-width="2"/>
  <rect x="60" y="80" width="160" height="30" fill="#3d3734" stroke="#ff2a3b" stroke-opacity="0.3"/>
  <rect x="60" y="700" width="160" height="80" fill="#3d3734"/>
  <!-- Carved Floral Relief Bands -->
  <rect x="80" y="240" width="120" height="20" fill="#d49755" opacity="0.4"/>
  <rect x="80" y="380" width="120" height="20" fill="#d49755" opacity="0.4"/>
  <rect x="80" y="520" width="120" height="20" fill="#d49755" opacity="0.4"/>

  <!-- Pillar 2 (Midground Left) -->
  <rect x="300" y="180" width="80" height="520" fill="url(#stonePillar)" opacity="0.9"/>
  <rect x="290" y="160" width="100" height="25" fill="#3d3734"/>

  <!-- Pillar 3 (Midground Right) -->
  <rect x="900" y="180" width="80" height="520" fill="url(#stonePillar)" opacity="0.9"/>
  <rect x="890" y="160" width="100" height="25" fill="#3d3734"/>

  <!-- Pillar 4 (Foreground Right) -->
  <rect x="1080" y="100" width="120" height="700" fill="url(#stonePillar)" stroke="#111" stroke-width="2"/>
  <rect x="1060" y="80" width="160" height="30" fill="#3d3734" stroke="#ff2a3b" stroke-opacity="0.3"/>
  <rect x="1060" y="700" width="160" height="80" fill="#3d3734"/>
  <rect x="1080" y="240" width="120" height="20" fill="#d49755" opacity="0.4"/>
  <rect x="1080" y="380" width="120" height="20" fill="#d49755" opacity="0.4"/>
  <rect x="1080" y="520" width="120" height="20" fill="#d49755" opacity="0.4"/>

  <!-- Warm Temple Diya / Lamp Flame Glow on Altar -->
  <circle cx="640" cy="510" r="6" fill="#ffffff"/>
  <ellipse cx="640" cy="510" rx="35" ry="35" fill="#ff7a1a" opacity="0.35"/>
  <ellipse cx="640" cy="510" rx="80" ry="80" fill="#ff2a3b" opacity="0.15"/>

  <!-- Overlay HUD Information -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#d49755" letter-spacing="3">ENVIRONMENT STUDY // ARCHITECTURE</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">TEMPLE ENVIRONMENT</text>
  <text x="1220" y="80" font-family="monospace" font-size="12" fill="#888888" letter-spacing="2" text-anchor="end">ARNOLD VOLUMETRIC SCATTERING</text>
</svg>
