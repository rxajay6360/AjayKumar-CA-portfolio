    <rect x="-24" y="140" width="48" height="280" rx="4" fill="#301b0f" stroke="#111111" stroke-width="2"/>
  </g>

  <text x="60" y="80" font-family="monospace" font-size="12" fill="#ff2a3b" letter-spacing="3">ARNOLD BEAUTY PASS // THREE-POINT LIGHT RIG</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">CLOSE-UP BEAUTY RENDER</text>
