      <stop offset="0%" stopColor="#1a0408"/>
      <stop offset="50%" stopColor="#0a0a0c"/>
      <stop offset="100%" stopColor="#040405"/>
    </radialGradient>
    <radialGradient id="thSpot" cx="60%" cy="30%" r="40%">
      <stop offset="0%" stopColor="#ff5355" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>
    <linearGradient id="thBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#e2e6ed"/>
      <stop offset="50%" stopColor="#434851"/>
