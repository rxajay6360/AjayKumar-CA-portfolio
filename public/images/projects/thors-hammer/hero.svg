<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="thDarkBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stopColor="#250307"/>
      <stop offset="45%" stopColor="#0d0d10"/>
      <stop offset="100%" stopColor="#050505"/>
    </radialGradient>
    <radialGradient id="thRim" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stopColor="#ff2a3b" stopOpacity="0.4"/>
      <stop offset="60%" stopColor="#7d070d" stopOpacity="0.1"/>
      <stop offset="100%" stopColor="#000000" stopOpacity="0"/>
    </radialGradient>
    <linearGradient id="thMetalGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stopColor="#c5cad4"/>
      <stop offset="25%" stopColor="#676c75"/>
      <stop offset="60%" stopColor="#2c2f36"/>
      <stop offset="100%" stopColor="#141518"/>
    </linearGradient>
    <linearGradient id="thGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffdb99"/>
      <stop offset="40%" stopColor="#d49755"/>
      <stop offset="100%" stopColor="#643e0d"/>
    </linearGradient>
    <filter id="thBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#thDarkBg)"/>
  <circle cx="640" cy="380" r="420" fill="url(#thRim)"/>

  <!-- Dramatic Rim Sparks & Dust Particles -->
  <circle cx="340" cy="220" r="2.5" fill="#ff5355" opacity="0.6"/>
  <circle cx="890" cy="180" r="1.5" fill="#ff5355" opacity="0.5"/>
  <circle cx="940" cy="460" r="2" fill="#ff5355" opacity="0.7"/>
  <circle cx="280" cy="510" r="3" fill="#ff5355" opacity="0.4"/>

  <!-- Hammer Head Main Geometry -->
  <g transform="translate(640, 360) rotate(-15)">
    <!-- Shadow beneath hammer -->
    <ellipse cx="0" cy="180" rx="380" ry="40" fill="#000000" opacity="0.8"/>

    <!-- Hammer Head Body -->
    <polygon points="-240,-120 240,-120 280,0 240,120 -240,120 -280,0" fill="url(#thMetalGrad)" stroke="#ff2a3b" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Beveled Chiseled Top & Bottom Facets -->
    <polygon points="-240,-120 240,-120 210,-70 -210,-70" fill="#ffffff" opacity="0.15"/>
    <polygon points="-240,120 240,120 210,70 -210,70" fill="#000000" opacity="0.6"/>

    <!-- Golden Ornamental Corner Brackets -->
    <path d="M-240,-120 L-180,-120 L-180,-70 L-240,-70 Z" fill="url(#thGold)"/>
    <path d="M240,-120 L180,-120 L180,-70 L240,-70 Z" fill="url(#thGold)"/>
    <path d="M-240,120 L-180,120 L-180,70 L-240,70 Z" fill="url(#thGold)"/>
    <path d="M240,120 L180,120 L180,70 L240,70 Z" fill="url(#thGold)"/>

    <!-- Glowing Ancient Norse Runes Inlay -->
    <g stroke="#ff2a3b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#thBloom)">
      <path d="M-120,-20 L-80,-20 L-100,20 L-60,20"/>
      <path d="M-30,-30 L0,30 L30,-30 M-15,0 L15,0"/>
      <path d="M60,-20 L100,-20 L80,20 L120,20"/>
    </g>

    <!-- Center Hammer Crest Medallion -->
    <circle cx="0" cy="0" r="28" fill="#15171b" stroke="url(#thGold)" stroke-width="3"/>
    <polygon points="0,-16 14,0 0,16 -14,0" fill="#ff2a3b" filter="url(#thBloom)"/>

    <!-- Hammer Handle / Shaft -->
    <rect x="-22" y="120" width="44" height="260" rx="4" fill="#301b0f" stroke="#111111" stroke-width="2"/>

    <!-- Leather Cross Straps Wrap -->
    <g stroke="#1a0e08" stroke-width="6">
      <line x1="-22" y1="150" x2="22" y2="180"/>
      <line x1="-22" y1="190" x2="22" y2="220"/>
      <line x1="-22" y1="230" x2="22" y2="260"/>
      <line x1="-22" y1="270" x2="22" y2="300"/>
      <line x1="-22" y1="310" x2="22" y2="340"/>
    </g>
    <!-- Highlight wire on leather -->
    <g stroke="#613b1e" stroke-width="1.5" opacity="0.6">
      <line x1="-22" y1="147" x2="22" y2="177"/>
      <line x1="-22" y1="187" x2="22" y2="217"/>
      <line x1="-22" y1="227" x2="22" y2="257"/>
    </g>

    <!-- Handle Pommel & Strap Loop -->
    <ellipse cx="0" cy="380" rx="32" ry="16" fill="url(#thMetalGrad)" stroke="url(#thGold)" stroke-width="2"/>
    <path d="M-10,385 C-10,430 10,430 10,385" stroke="#301b0f" stroke-width="8" fill="none"/>
  </g>

  <!-- Technical Overlay HUD Text -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#ff2a3b" letter-spacing="3">HERO PROP // MJÖLNIR</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">THOR&apos;S HAMMER</text>
  <text x="1220" y="80" font-family="monospace" font-size="12" fill="#888888" letter-spacing="2" text-anchor="end">ARNOLD SHADER: aiStandardSurface</text>
</svg>
