<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="thDetailBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stopColor="#1c0508"/>
      <stop offset="60%" stopColor="#08080a"/>
      <stop offset="100%" stopColor="#030304"/>
    </radialGradient>
    <linearGradient id="leatherMacro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#543018"/>
      <stop offset="50%" stopColor="#351d0d"/>
      <stop offset="100%" stopColor="#180b04"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#thDetailBg)"/>

  <!-- Macro Close-Up: Leather Wrap & Edge Abrasion -->
  <g transform="translate(640, 400)">
    <!-- Base Steel Surface -->
    <rect x="-450" y="-300" width="900" height="600" fill="#202226" stroke="#ff2a3b" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Micro Metal Scratch Lines -->
    <line x1="-350" y1="-150" x2="-280" y2="-120" stroke="#777c85" stroke-width="1.5" opacity="0.6"/>
    <line x1="-320" y1="-100" x2="-220" y2="-80" stroke="#777c85" stroke-width="1" opacity="0.5"/>
    <line x1="180" y1="120" x2="290" y2="180" stroke="#777c85" stroke-width="2" opacity="0.7"/>

    <!-- Leather Wrap Strap Band -->
    <polygon points="-400,50 400,-150 400,50 -400,250" fill="url(#leatherMacro)" stroke="#ff2a3b" stroke-width="1"/>

    <!-- Stitching Relief Marks along Leather Edge -->
    <g stroke="#d49755" stroke-width="3" stroke-linecap="round">
      <line x1="-350" y1="75" x2="-340" y2="70"/>
      <line x1="-300" y1="50" x2="-290" y2="45"/>
      <line x1="-250" y1="25" x2="-240" y2="20"/>
      <line x1="-200" y1="0" x2="-190" y2="-5"/>
      <line x1="-150" y1="-25" x2="-140" y2="-30"/>
      <line x1="-100" y1="-50" x2="-90" y2="-55"/>
      <line x1="-50" y1="-75" x2="-40" y2="-80"/>
      <line x1="0" y1="-100" x2="10" y2="-105"/>
      <line x1="50" y1="-125" x2="60" y2="-130"/>
    </g>
  </g>

  <text x="60" y="80" font-family="monospace" font-size="12" fill="#d49755" letter-spacing="3">SUBSTANCE 3D PAINTER // 4K MACRO MATERIAL BREAKDOWN</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">LEATHER WRAP &amp; EDGE CHIPPING</text>
</svg>
