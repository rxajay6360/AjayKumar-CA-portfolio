<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="800" fill="#08080a"/>

  <!-- Maya 3D Viewport Grid -->
  <defs>
    <pattern id="viewportGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#viewportGrid)"/>

  <!-- Center Axis Coordinates -->
  <line x1="640" y1="0" x2="640" y2="800" stroke="rgba(0,255,255,0.15)" stroke-width="1"/>
  <line x1="0" y1="400" x2="1280" y2="400" stroke="rgba(255,0,0,0.15)" stroke-width="1"/>

  <!-- Wireframe Mesh in Maya Cyan / Crimson -->
  <g transform="translate(640, 360) rotate(-15)">
    <!-- Base Polygon Hull -->
    <polygon points="-240,-120 240,-120 280,0 240,120 -240,120 -280,0" stroke="#00f3ff" stroke-width="2" fill="none"/>
    <polygon points="-210,-70 210,-70 240,0 210,70 -210,70 -240,0" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="4 2" fill="none"/>

    <!-- Quad Topology Longitudinal Subdivisions -->
    <line x1="-180" y1="-120" x2="-180" y2="120" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>
    <line x1="-120" y1="-120" x2="-120" y2="120" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>
    <line x1="-60" y1="-120" x2="-60" y2="120" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#ff2a3b" stroke-width="1.5" opacity="0.9"/>
    <line x1="60" y1="-120" x2="60" y2="120" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>
    <line x1="120" y1="-120" x2="120" y2="120" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>
    <line x1="180" y1="-120" x2="180" y2="120" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>

    <!-- Latitudinal Subdivisions -->
    <line x1="-260" y1="-60" x2="260" y2="-60" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#ff2a3b" stroke-width="1.5" opacity="0.9"/>
    <line x1="-260" y1="60" x2="260" y2="60" stroke="#00f3ff" stroke-width="1" opacity="0.75"/>

    <!-- Support Loops near Corners -->
    <line x1="-230" y1="-120" x2="-230" y2="120" stroke="#00f3ff" stroke-width="0.75" opacity="0.5"/>
    <line x1="230" y1="-120" x2="230" y2="120" stroke="#00f3ff" stroke-width="0.75" opacity="0.5"/>

    <!-- Handle Wireframe -->
    <rect x="-22" y="120" width="44" height="260" stroke="#00f3ff" stroke-width="2" fill="none"/>
    <line x1="0" y1="120" x2="0" y2="380" stroke="#ff2a3b" stroke-width="1"/>
    <line x1="-22" y1="160" x2="22" y2="160" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
    <line x1="-22" y1="200" x2="22" y2="200" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
    <line x1="-22" y1="240" x2="22" y2="240" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
    <line x1="-22" y1="280" x2="22" y2="280" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
    <line x1="-22" y1="320" x2="22" y2="320" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>
    <line x1="-22" y1="360" x2="22" y2="360" stroke="#00f3ff" stroke-width="1" opacity="0.7"/>

    <!-- Pommel Wireframe -->
    <ellipse cx="0" cy="380" rx="32" ry="16" stroke="#00f3ff" stroke-width="1.5" fill="none"/>
    <ellipse cx="0" cy="380" rx="20" ry="10" stroke="#00f3ff" stroke-width="1" fill="none"/>

    <!-- Key Vertex Handles -->
    <circle cx="-240" cy="-120" r="3" fill="#ffffff"/>
    <circle cx="240" cy="-120" r="3" fill="#ffffff"/>
    <circle cx="280" cy="0" r="3" fill="#ffffff"/>
    <circle cx="240" cy="120" r="3" fill="#ffffff"/>
    <circle cx="-240" cy="120" r="3" fill="#ffffff"/>
    <circle cx="-280" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Maya Readout Header -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#00f3ff" letter-spacing="3">MAYA 2025 // TOPOLOGY EVALUATION</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">QUAD TOPOLOGY &bull; SUBD READY</text>
  <text x="1220" y="80" font-family="monospace" font-size="12" fill="#888888" letter-spacing="2" text-anchor="end">VERTICES: 12,482 // POLYGONS: 24,960</text>
</svg>
