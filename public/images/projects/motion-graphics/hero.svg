<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mgBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stopColor="#290509"/>
      <stop offset="40%" stopColor="#120407"/>
      <stop offset="100%" stopColor="#040405"/>
    </radialGradient>
    <linearGradient id="laserRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#ff5355" stopOpacity="0"/>
      <stop offset="50%" stopColor="#ff2a3b"/>
      <stop offset="100%" stopColor="#ff5355" stopOpacity="0"/>
    </linearGradient>
    <filter id="mgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#mgBg)"/>

  <!-- Optical Flare Beam Horizon Line -->
  <line x1="0" y1="400" x2="1280" y2="400" stroke="url(#laserRed)" stroke-width="4" filter="url(#mgGlow)"/>
  <circle cx="640" cy="400" r="18" fill="#ffffff" filter="url(#mgGlow)"/>
  <ellipse cx="640" cy="400" rx="320" ry="12" fill="#ff2a3b" opacity="0.6" filter="url(#mgGlow)"/>

  <!-- Kinetic Typography Title Sequence Composition -->
  <g transform="translate(640, 390)">
    <!-- Skewed Depth Shadow Typography -->
    <text x="0" y="-80" font-family="sans-serif" font-weight="900" font-size="94" fill="#000000" letter-spacing="8" text-anchor="middle" opacity="0.8">CINEMATIC</text>
    <text x="0" y="70" font-family="sans-serif" font-weight="900" font-size="94" fill="#000000" letter-spacing="8" text-anchor="middle" opacity="0.8">MOTION</text>

    <!-- Front Stark High-Contrast Typography with Crimson Accent -->
    <text x="-6" y="-86" font-family="sans-serif" font-weight="900" font-size="94" fill="#ffffff" letter-spacing="8" text-anchor="middle">CINEMATIC</text>
    <text x="6" y="64" font-family="sans-serif" font-weight="900" font-size="94" fill="#ff2a3b" letter-spacing="8" text-anchor="middle" filter="url(#mgGlow)">MOTION</text>

    <!-- Speed Graphic Corner Markers -->
    <path d="M-420,-160 L-460,-160 L-460,-120" stroke="#ff2a3b" stroke-width="3" fill="none"/>
    <path d="M420,-160 L460,-160 L460,-120" stroke="#ff2a3b" stroke-width="3" fill="none"/>
    <path d="M-420,160 L-460,160 L-460,120" stroke="#ff2a3b" stroke-width="3" fill="none"/>
    <path d="M420,160 L460,160 L460,120" stroke="#ff2a3b" stroke-width="3" fill="none"/>

    <!-- Film Timecode / Frame Trackers -->
    <text x="-440" y="-180" font-family="monospace" font-size="12" fill="#888888">TC: 01:24:18:04</text>
    <text x="440" y="-180" font-family="monospace" font-size="12" fill="#888888" text-anchor="end">FPS: 60.00 // 4K UHD</text>
  </g>

  <!-- Broadcast Audio Waveform & Glitch Pacing Elements -->
  <g transform="translate(640, 640)" stroke="#ff2a3b" opacity="0.6">
    <line x1="-300" y1="0" x2="-260" y2="0" stroke-width="2"/>
    <line x1="-240" y1="-15" x2="-240" y2="15" stroke-width="2"/>
    <line x1="-200" y1="-30" x2="-200" y2="30" stroke-width="3"/>
    <line x1="-160" y1="-10" x2="-160" y2="10" stroke-width="2"/>
    <line x1="-120" y1="-45" x2="-120" y2="45" stroke-width="4"/>
    <line x1="-80" y1="-20" x2="-80" y2="20" stroke-width="2"/>
    <line x1="-40" y1="-55" x2="-40" y2="55" stroke-width="4"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke-width="5" stroke="#ffffff"/>
    <line x1="40" y1="-55" x2="40" y2="55" stroke-width="4"/>
    <line x1="80" y1="-20" x2="80" y2="20" stroke-width="2"/>
    <line x1="120" y1="-45" x2="120" y2="45" stroke-width="4"/>
    <line x1="160" y1="-10" x2="160" y2="10" stroke-width="2"/>
    <line x1="200" y1="-30" x2="200" y2="30" stroke-width="3"/>
    <line x1="240" y1="-15" x2="240" y2="15" stroke-width="2"/>
    <line x1="260" y1="0" x2="300" y2="0" stroke-width="2"/>
  </g>

  <!-- Technical Overlay HUD -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#ff2a3b" letter-spacing="3">MOTION DESIGN // AFTER EFFECTS &amp; PREMIERE</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">CINEMATIC MOTION GRAPHICS</text>
  <text x="1220" y="80" font-family="monospace" font-size="12" fill="#888888" letter-spacing="2" text-anchor="end">KINETIC TYPOGRAPHY &bull; SPEED GRAPH CURVES</text>
</svg>
