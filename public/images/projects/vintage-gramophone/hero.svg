<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gramBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stopColor="#2e1505"/>
      <stop offset="40%" stopColor="#140a03"/>
      <stop offset="100%" stopColor="#040405"/>
    </radialGradient>
    <linearGradient id="brassHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffe6a8"/>
      <stop offset="35%" stopColor="#d49755"/>
      <stop offset="70%" stopColor="#7a4a0e"/>
      <stop offset="100%" stopColor="#3d2102"/>
    </linearGradient>
    <linearGradient id="woodCase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4d1b0d"/>
      <stop offset="50%" stopColor="#2b0e06"/>
      <stop offset="100%" stopColor="#170602"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#gramBg)"/>

  <!-- Dramatic Studio Light Pool -->
  <ellipse cx="640" cy="580" rx="420" ry="80" fill="#000000" opacity="0.8"/>
  <ellipse cx="640" cy="580" rx="350" ry="60" fill="#ff7a1a" opacity="0.08"/>

  <!-- Gramophone Group -->
  <g transform="translate(640, 420)">
    <!-- Polished Wooden Cabinet Base -->
    <rect x="-220" y="80" width="440" height="130" rx="8" fill="url(#woodCase)" stroke="#d49755" stroke-opacity="0.6" stroke-width="2"/>
    <!-- Cabinet Beveled Molding Plinth -->
    <rect x="-240" y="200" width="480" height="30" rx="4" fill="#1b0803" stroke="#d49755" stroke-opacity="0.4"/>
    <rect x="-200" y="70" width="400" height="15" rx="3" fill="#381308"/>

    <!-- Brass Corner Accents & Plaque -->
    <rect x="-50" y="130" width="100" height="35" rx="2" fill="url(#brassHorn)" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="0" y="152" font-family="serif" font-size="12" fill="#111" font-weight="bold" text-anchor="middle">HIS MASTER&apos;S VOICE</text>

    <!-- Turntable Platter & Vinyl Record -->
    <ellipse cx="-40" cy="65" rx="160" ry="32" fill="#111113" stroke="#222" stroke-width="2"/>
    <!-- Vinyl Grooves -->
    <ellipse cx="-40" cy="65" rx="140" ry="26" stroke="#ffffff" stroke-opacity="0.1" fill="none"/>
    <ellipse cx="-40" cy="65" rx="110" ry="20" stroke="#ffffff" stroke-opacity="0.12" fill="none"/>
    <ellipse cx="-40" cy="65" rx="70" ry="14" stroke="#ffffff" stroke-opacity="0.1" fill="none"/>
    <!-- Record Center Red Label -->
    <ellipse cx="-40" cy="65" rx="42" ry="9" fill="#ff2a3b"/>

    <!-- Soundbox Needle Arm & Tonearm -->
    <path d="M120,65 C120,10 60,30 20,60" stroke="url(#brassHorn)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="60" r="10" fill="url(#brassHorn)"/>
    <line x1="20" y1="60" x2="10" y2="68" stroke="#ffffff" stroke-width="2"/>

    <!-- Magnificent Fluted Brass Horn Bell -->
    <!-- Support Neck Elbow -->
    <path d="M120,65 C130,-40 70,-110 30,-160" stroke="url(#brassHorn)" stroke-width="28" fill="none" stroke-linecap="round"/>

    <!-- Bell Flare Petals -->
    <path d="M30,-160 C-20,-240 -120,-320 -240,-350 C-10,-330 180,-290 280,-220 C230,-140 120,-110 30,-160 Z" fill="url(#brassHorn)" stroke="#ffdb99" stroke-width="2"/>
    <!-- Concentric Hammered Brass Rings inside Bell -->
    <ellipse cx="60" cy="-260" rx="200" ry="80" stroke="#ffdb99" stroke-opacity="0.4" stroke-width="3" fill="none" transform="rotate(-20 60 -260)"/>
    <ellipse cx="60" cy="-260" rx="140" ry="55" stroke="#ffdb99" stroke-opacity="0.3" stroke-width="2" fill="none" transform="rotate(-20 60 -260)"/>
    <ellipse cx="60" cy="-260" rx="70" ry="28" stroke="#ffdb99" stroke-opacity="0.25" stroke-width="1.5" fill="none" transform="rotate(-20 60 -260)"/>

    <!-- Winding Hand Crank on Right -->
    <path d="M220,140 L260,140 L260,100 L275,100" stroke="url(#brassHorn)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="275" cy="100" r="6" fill="#381308"/>
  </g>

  <!-- Technical Overlay HUD -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#d49755" letter-spacing="3">PRODUCT VISUALIZATION // ANTIQUE STUDY</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">VINTAGE GRAMOPHONE</text>
  <text x="1220" y="80" font-family="monospace" font-size="12" fill="#888888" letter-spacing="2" text-anchor="end">ANISOTROPIC SHADING &bull; MAHOGANY CLEARCOAT</text>
</svg>
