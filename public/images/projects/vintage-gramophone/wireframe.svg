<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="800" fill="#08080a"/>
  <defs>
    <pattern id="gramWireGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#gramWireGrid)"/>

  <!-- Wireframe Horn and Base -->
  <g transform="translate(640, 420)" stroke="#00f3ff" stroke-width="1.5">
    <!-- Base Cabinet Wireframe -->
    <rect x="-220" y="80" width="440" height="130" rx="8" fill="none"/>
    <line x1="-220" y1="120" x2="220" y2="120"/>
    <line x1="-220" y1="160" x2="220" y2="160"/>
    <line x1="-110" y1="80" x2="-110" y2="210"/>
    <line x1="0" y1="80" x2="0" y2="210" stroke="#ff2a3b"/>
    <line x1="110" y1="80" x2="110" y2="210"/>

    <!-- Turntable Platter Wireframe -->
    <ellipse cx="-40" cy="65" rx="160" ry="32" fill="none"/>
    <line x1="-200" y1="65" x2="120" y2="65"/>
    <line x1="-40" y1="33" x2="-40" y2="97"/>

    <!-- Brass Horn Wireframe Latitudinal & Radial Iso-curves -->
    <ellipse cx="60" cy="-260" rx="200" ry="80" fill="none" transform="rotate(-20 60 -260)"/>
    <ellipse cx="60" cy="-260" rx="140" ry="55" fill="none" transform="rotate(-20 60 -260)"/>
    <ellipse cx="60" cy="-260" rx="80" ry="30" fill="none" transform="rotate(-20 60 -260)"/>
    <line x1="30" y1="-160" x2="-120" y2="-320" stroke="#ff2a3b"/>
    <line x1="30" y1="-160" x2="280" y2="-220" stroke="#ff2a3b"/>
    <line x1="30" y1="-160" x2="60" y2="-340"/>
  </g>

  <text x="60" y="80" font-family="monospace" font-size="12" fill="#00f3ff" letter-spacing="3">MAYA CURVE &amp; LATHE REVOLVE // TOPOLOGY</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">RADIAL WIREFRAME MESH</text>
</svg>
