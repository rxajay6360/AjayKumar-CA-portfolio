<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bcBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stopColor="#251e04"/>
      <stop offset="45%" stopColor="#100d02"/>
      <stop offset="100%" stopColor="#040405"/>
    </radialGradient>
    <linearGradient id="bananaYellow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#fff176"/>
      <stop offset="40%" stopColor="#fbc02d"/>
      <stop offset="80%" stopColor="#f57f17"/>
      <stop offset="100%" stopColor="#827717"/>
    </linearGradient>
    <linearGradient id="tireRubber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#37393d"/>
      <stop offset="70%" stopColor="#1a1b1d"/>
      <stop offset="100%" stopColor="#0d0e0f"/>
    </linearGradient>
    <linearGradient id="canopyGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#80d8ff" stopOpacity="0.8"/>
      <stop offset="60%" stopColor="#0091ea" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#01579b" stopOpacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bcBg)"/>

  <!-- Studio Floor Ground Shadow -->
  <ellipse cx="640" cy="560" rx="460" ry="60" fill="#000000" opacity="0.8"/>
  <ellipse cx="640" cy="560" rx="380" ry="40" fill="#fbc02d" opacity="0.1"/>

  <!-- Stylized Banana Car Vehicle Group -->
  <g transform="translate(640, 440)">
    <!-- Aerodynamic Banana Curved Chassis Body -->
    <path d="M-360,-20 C-320,-120 -150,-160 80,-140 C280,-120 380,-20 380,20 C360,90 220,110 50,110 C-180,110 -320,60 -360,-20 Z" fill="url(#bananaYellow)" stroke="#ff2a3b" stroke-width="2"/>

    <!-- Green Stem Rear Exhaust / Fin -->
    <path d="M-360,-20 C-410,-35 -430,-60 -420,-85 C-400,-95 -380,-70 -350,-45 Z" fill="#689f38" stroke="#33691e" stroke-width="2"/>
    <ellipse cx="-420" cy="-80" rx="14" ry="8" fill="#33691e"/>

    <!-- Tip Nose Front Chrome Bumper Cap -->
    <path d="M360,-10 C380,0 395,15 385,30 C370,40 350,30 345,15 Z" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="1.5"/>

    <!-- Glossy Aero Cockpit Windshield Canopy -->
    <path d="M-60,-130 C-30,-200 120,-190 180,-130 C120,-120 20,-115 -60,-130 Z" fill="url(#canopyGlass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M-10,-170 C30,-185 80,-180 130,-150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Dual Racing Stripe Decals in Crimson -->
    <path d="M-280,-30 C-100,-80 120,-80 320,-5" stroke="#ff2a3b" stroke-width="8" fill="none"/>
    <path d="M-270,-15 C-95,-65 125,-65 315,10" stroke="#ff2a3b" stroke-width="3" fill="none"/>

    <!-- Rear Big Cartoon Tire Wheel -->
    <g transform="translate(-180, 70)">
      <circle cx="0" cy="0" r="85" fill="url(#tireRubber)" stroke="#111" stroke-width="3"/>
      <!-- Deep Treads -->
      <circle cx="0" cy="0" r="70" stroke="#222" stroke-width="6" stroke-dasharray="16 8" fill="none"/>
      <!-- Chrome Center Hubcap -->
      <circle cx="0" cy="0" r="42" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#fbc02d" stroke="#ff2a3b" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#ff2a3b"/>
    </g>

    <!-- Front Steering Cartoon Tire Wheel -->
    <g transform="translate(220, 70)">
      <circle cx="0" cy="0" r="75" fill="url(#tireRubber)" stroke="#111" stroke-width="3"/>
      <circle cx="0" cy="0" r="62" stroke="#222" stroke-width="5" stroke-dasharray="14 7" fill="none"/>
      <circle cx="0" cy="0" r="36" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
      <circle cx="0" cy="0" r="20" fill="#fbc02d" stroke="#ff2a3b" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#ff2a3b"/>
    </g>

    <!-- Headlight Beam Flare -->
    <ellipse cx="370" cy="20" rx="14" ry="18" fill="#fff9c4" stroke="#fbc02d" stroke-width="2"/>
    <polygon points="380,20 600,-30 600,100" fill="#fff9c4" opacity="0.08"/>
  </g>

  <!-- Technical Overlay HUD -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#fbc02d" letter-spacing="3">STYLIZED 3D VEHICLE // CONCEPT ART</text>
  <text x="60" y="105" font-family="sans-serif" font-weight="700" font-size="28" fill="#ffffff">BANANA CAR</text>
  <text x="1220" y="80" font-family="monospace" font-size="12" fill="#888888" letter-spacing="2" text-anchor="end">AUTODESK MAYA &bull; SUBD SURFACE FLOW</text>
</svg>
